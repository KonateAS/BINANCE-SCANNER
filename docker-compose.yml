services:
  postgres:
    image: postgres:16-alpine
    container_name: binance-scanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner_local
    ports: ["5432:5432"]
    volumes: ["scanner_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  scanner_pgdata:
